name: Update Google IP Rules

on:
  schedule:
    # 每天 UTC 00:10 运行一次(北京时间 08:10)
    - cron: '10 0 * * *'
  workflow_dispatch: {}   # 支持手动触发

permissions:
  contents: write

concurrency:
  group: update-ip-rules
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate IP rules
        run: python3 scripts/generate_ip_rules.py

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet -- output/google-ip-rules.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push if changed
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/google-ip-rules.json
          git commit -m "chore: update Google IP rules ($(date -u +'%Y-%m-%d %H:%M UTC'))"
          git push

      - name: No changes detected
        if: steps.diff.outputs.changed == 'false'
        run: echo "IP 段无变化,跳过提交。"
